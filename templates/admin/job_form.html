{% extends "base.html" %}
{% block title %}{{ 'Edit Job' if job_id else 'New Job' }} | Admin | ZimJobs Hub{% endblock %}
{% block content %}
{% set active = 'jobs' %}{% include "admin/_nav.html" %}
<article class="card detail">
  <h1>{{ 'Edit job' if job_id else 'New job' }}</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" class="form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Job title <input name="title" required value="{{ job['title'] if job }}"></label>
    <label>Company <input name="company" required value="{{ job['company'] if job }}"></label>
    <label>Location <input name="location" required value="{{ job['location'] if job }}"
           placeholder="e.g. Harare or Remote"></label>
    <label>Category
      <select name="category">{% for c in categories %}
        <option {{ 'selected' if job and job['category'] == c }}>{{ c }}</option>
      {% endfor %}</select>
    </label>
    <label>Summary <textarea name="summary" rows="5" required>{{ job['summary'] if job }}</textarea></label>
    <label>Apply URL <input name="apply_url" type="url" required value="{{ job['apply_url'] if job }}"></label>
    <div class="form-grid">
      <label>Job type
        <select name="employment_type"><option value="">— optional —</option>
          {% for o in employment_types %}<option {{ 'selected' if job and job['employment_type'] == o }}>{{ o }}</option>{% endfor %}
        </select>
      </label>
      <label>Workplace
        <select name="remote_status"><option value="">— optional —</option>
          {% for o in remote_options %}<option {{ 'selected' if job and job['remote_status'] == o }}>{{ o }}</option>{% endfor %}
        </select>
      </label>
      <label>Experience level
        <select name="experience_level"><option value="">— optional —</option>
          {% for o in experience_levels %}<option {{ 'selected' if job and job['experience_level'] == o }}>{{ o }}</option>{% endfor %}
        </select>
      </label>
      <label>Salary range <input name="salary_range" value="{{ job['salary_range'] if job }}" placeholder="e.g. $500–$800/month"></label>
      <label>Application deadline <input name="expires_at" type="date" value="{{ job['expires_at'] if job }}"></label>
      <label>Skills / tags <input name="tags" value="{{ job['tags'] if job }}" placeholder="comma-separated"></label>
    </div>
    <label class="chk"><input type="checkbox" name="featured"
           {{ 'checked' if job and job['featured'] }}> Featured listing</label>
    <button class="btn" type="submit">Save job</button>
  </form>
</article>
{% endblock %}
