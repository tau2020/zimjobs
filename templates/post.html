{% extends "base.html" %}
{% block title %}Post a Job | ZimJobs Hub{% endblock %}
{% block content %}
<article class="card detail">
  <h1>Post a Job</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" class="form">
    <label>Job title <input name="title" required></label>
    <label>Company <input name="company" required></label>
    <label>Location <input name="location" required placeholder="e.g. Harare or Remote"></label>
    <label>Category
      <select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select>
    </label>
    <label>Summary <textarea name="summary" rows="5" required></textarea></label>
    <label>Apply URL <input name="apply_url" type="url" required></label>
    <div class="form-grid">
      <label>Job type
        <select name="employment_type"><option value="">— optional —</option>
          {% for o in employment_types %}<option>{{ o }}</option>{% endfor %}
        </select>
      </label>
      <label>Workplace
        <select name="remote_status"><option value="">— optional —</option>
          {% for o in remote_options %}<option>{{ o }}</option>{% endfor %}
        </select>
      </label>
      <label>Experience level
        <select name="experience_level"><option value="">— optional —</option>
          {% for o in experience_levels %}<option>{{ o }}</option>{% endfor %}
        </select>
      </label>
      <label>Salary range <input name="salary_range" placeholder="e.g. $500–$800/month"></label>
      <label>Application deadline <input name="expires_at" type="date"></label>
      <label>Skills / tags <input name="tags" placeholder="comma-separated, e.g. Excel, M&E, Driving"></label>
    </div>
    <label class="chk"><input type="checkbox" name="featured">
      Featured listing ($15 — invoice via PayPal)</label>
    <label>Admin token <input name="token" type="password" required></label>
    <button class="btn" type="submit">Publish job</button>
  </form>
</article>
{% endblock %}
