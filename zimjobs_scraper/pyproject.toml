[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zimjobs-scraper"
version = "0.2.0"
description = "ZimJobs job-board scraping, mapping, validation and SQLite ingestion pipeline"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "python-dateutil>=2.9.0",
  "requests>=2.32.3"
]

[project.optional-dependencies]
test = ["pytest>=8.3.4"]

[project.scripts]
zimjobs-scraper = "zimjobs_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
